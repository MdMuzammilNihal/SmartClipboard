[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-clipboard"
version = "0.1.0"
description = "A privacy-focused smart clipboard for Windows. Not a password manager."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

# Dependencies are pinned and deliberately few. The app must make no network
# calls, so every addition needs a reason and a check of what it does.
dependencies = [
    "pywin32==312",
    # Windows Runtime bindings, used only to remove confirmed secrets from
    # Win+V clipboard history (winhistory.py; owner's approval 2026-11-19).
    # No network use. Storage.Streams is required by DataTransfer; it is
    # pinned here so every install gets the same version.
    "winrt-runtime==4.2.0",
    "winrt-Windows.ApplicationModel.DataTransfer==4!10.0.28000.2957",
    "winrt-Windows.Foundation==4!10.0.28000.2957",
    "winrt-Windows.Foundation.Collections==4!10.0.28000.2957",
    "winrt-Windows.Storage.Streams==4!10.0.28000.2957",
]

[project.optional-dependencies]
# PySide6 is an approved runtime dependency. It sits in its own group only so
# the foundation work (listener, storage, classifier) does not need the large
# Qt install. It moves into `dependencies` when the UI work starts.
ui = [
    "PySide6==6.12.0",
]
dev = [
    "pytest==9.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets the tests import `smartclip` from src/ without installing the package.
pythonpath = ["src"]
